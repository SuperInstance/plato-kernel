[workspace]
members = [
    ".",
    "crates/constraint-theory-core",
]

[package]
name = "plato-kernel"
version = "0.1.0"
edition = "2021"
description = "Plato Kernel - Event sourcing + Constraint-Theory + Git runtime"
license = "MIT"

[dependencies]
# Constraint Theory core types (local crate — workspace member)
constraint-theory-core = { path = "crates/constraint-theory-core" }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Event sourcing — pin uuid to 1.4.x to stay on getrandom 0.2 (Rust 1.75 compat)
uuid = { version = "=1.4.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"

getrandom = "0.2"

[[bin]]
name = "plato-kernel"
path = "src/main.rs"
