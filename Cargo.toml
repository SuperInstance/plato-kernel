[package]
name = "plato-kernel"
version = "0.1.0"
edition = "2021"
description = "Plato Kernel - Event sourcing + Constraint-Theory + Git runtime"
license = "MIT"

[dependencies]
# Constraint Theory (local path — synthesis workspace sibling)
constraint-theory-core = { path = "../constraint-theory/crates/constraint-theory-core" }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Git runtime
git2 = "0.18"
async-git = "0.1"  # Or use git2 with async wrapper

# Event sourcing
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
deadqueue = "0.3"  # DLQ implementation

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "plato-kernel"
path = "src/main.rs"
